[project]
name = "assaykit"
version = "0.1.0"
description = "DPPH, FRAP, peroxide value and free fatty acid analysis for antioxidant and oil-quality labs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]

[project.scripts]
assaykit = "assaykit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assaykit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
